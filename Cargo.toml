[workspace]
resolver = "2"
members = [
    "crates/mapgen-core",
    "crates/mapgen-geom",
    "crates/mapgen-world",
    "crates/mapgen-history",
    "crates/mapgen-render",
    "crates/mapgen-lore",
    "crates/mapgen-cli",
    "crates/mapgen-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mbeaman/mapgen"

[workspace.dependencies]
# Geometry
voronoice = "0.2"

# Noise / RNG
noise = "0.9"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
rand_chacha = "0.3"

# Collections
indexmap = { version = "2", features = ["serde"] }
smallvec = { version = "1", features = ["serde", "union"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# Rendering
svg = "0.17"
# PNG export (native-only — used by mapgen-cli for the sweep grid).
# Arch §1 originally pinned 0.43; bumped to current stable after API verification.
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"

# Math (cross-platform determinism)
libm = "0.2"

# CLI / async (native only)
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
flate2 = "1"

# WASM
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Tests
proptest = "1"
insta = { version = "1", features = ["yaml"] }
blake3 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.release.package."*"]
opt-level = 3
