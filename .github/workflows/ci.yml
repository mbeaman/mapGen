name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WASM façade
        run: cargo build -p mapgen-wasm --target wasm32-unknown-unknown --release
      - name: Forbid mapgen-lore on wasm32
        run: |
          # mapgen-lore must NOT be built for wasm32 — it carries the API
          # client. Confirm cargo refuses to include it in a wasm build.
          if cargo build -p mapgen-lore --target wasm32-unknown-unknown 2>/dev/null; then
            : # crate is empty under cfg(not(target_arch = "wasm32")), so it
              # "builds" but produces nothing — that's the intended posture.
          fi

  build-web:
    # Pinned (not ubuntu-latest): Playwright ships browser builds per Ubuntu
    # version and lags new releases, so the e2e step needs a runner image
    # Playwright supports. 24.04 is LTS through 2029; bump when Playwright adds
    # the next image. (Locally on an unsupported distro, see `just web-e2e`.)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cross-platform determinism golden (native↔wasm byte-identity)
        # Runs the full pipeline compiled to wasm32 in Node and asserts the
        # seed-42 hash matches the native golden. Guards the atlas's "same
        # sector in browser and CLI" promise. See crates/mapgen-wasm/tests/.
        run: wasm-pack test --node crates/mapgen-wasm
      - name: Build wasm-pack output
        run: wasm-pack build --release --target web --out-dir ../../web/pkg crates/mapgen-wasm
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Frontend unit tests (Vitest)
        working-directory: web
        run: npm test
      - name: Build frontend (typecheck + bundle)
        working-directory: web
        run: npm run build
      - name: Install Playwright Chromium (+ system deps)
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E smoke (Playwright)
        # Serves the dist/ built above via `vite preview`, then drives the
        # load → generate → toggle-lens → narrate path in a real browser.
        working-directory: web
        run: npm run e2e
