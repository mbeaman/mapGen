[package]
name = "mapgen-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SVG renderer with pluggable style modules."

[dependencies]
mapgen-core = { path = "../mapgen-core" }
svg = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libm = { workspace = true }
base64 = { workspace = true }
roughr = { workspace = true }
euclid = { workspace = true }

[dev-dependencies]
mapgen-world = { path = "../mapgen-world" }
# Canonical seeds + the earned-overseas-seizure probe for the political
# legibility claims. Dev-only; the testsupport -> world -> (dev) render cycle is
# permitted by Cargo (closes through a dev edge).
mapgen-testsupport = { path = "../mapgen-testsupport" }
