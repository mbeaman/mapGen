[package]
name = "mapgen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser-facing wasm-bindgen façade for mapgen."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mapgen-core = { path = "../mapgen-core" }
mapgen-world = { path = "../mapgen-world" }
mapgen-render = { path = "../mapgen-render" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Enable getrandom's `js` feature on wasm32 so transitive rand-based
# deps (roughr → rand → getrandom) build. getrandom otherwise errors
# out on `wasm*-unknown-unknown` per its compile-time check.
getrandom = { version = "0.2", features = ["js"] }
