[package]
name = "mapgen-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Browser-facing wasm-bindgen façade for mapgen."

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-pack tries to download a specific binaryen release for wasm-opt;
# the download is network-policy-blocked in some build environments. Skip
# it here — CI / release builds can re-enable when binaryen is reachable.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[dependencies]
mapgen-core = { path = "../mapgen-core" }
mapgen-world = { path = "../mapgen-world" }
mapgen-render = { path = "../mapgen-render" }
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Enable getrandom's `js` feature on wasm32 so transitive rand-based
# deps (roughr → rand → getrandom) build. getrandom otherwise errors
# out on `wasm*-unknown-unknown` per its compile-time check.
getrandom = { version = "0.2", features = ["js"] }
# Worker-side RGBA rasterizer (off-main-thread globe tiles — `render_rgba`).
# `default-features = false` drops usvg's text/system-fonts/memmap-fonts and
# resvg's raster-images: globe tiles are FONTLESS and vector-only, so this keeps
# fontdb/memmap2 (which don't build on wasm32) out and shrinks the bundle. These
# can't use `workspace = true` — the workspace pins default features ON (mapgen-cli
# needs text for its labelled PNG export); resolver-2 keeps this crate's wasm32
# graph text-free without affecting mapgen-cli's native build.
resvg = { version = "0.47", default-features = false }
usvg = { version = "0.47", default-features = false }
tiny-skia = "0.12"

[dev-dependencies]
# 6.2 cross-platform golden: run the full pipeline compiled to wasm32 (in Node)
# and assert byte-identity with the native golden. ciborium + blake3 reproduce
# mapgen-world's hashing exactly; wasm-bindgen-test drives the wasm runner.
wasm-bindgen-test = "0.3"
ciborium = { workspace = true }
blake3 = { workspace = true }
