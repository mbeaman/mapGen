[package]
name = "mapgen-lore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Claude integration. Native-only; never compiled for WASM."

# Crate is a no-op on wasm32 to enforce the native-only invariant.
[lib]
path = "src/lib.rs"

[features]
# Opt-in: enables the real Anthropic HTTP client (Phase 5e). OFF by default, so a
# stock build pulls in no network deps and cannot make a paid API call. The
# offline template narrator and the whole grounding pipeline compile regardless.
lore = ["dep:ureq"]

[dependencies]
mapgen-core = { path = "../mapgen-core" }
mapgen-history = { path = "../mapgen-history" }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
# Blocking HTTP for the Anthropic client; only compiled with the `lore` feature.
# `json` brings `send_json` / `into_json` (rustls TLS is on by default).
ureq = { version = "2", optional = true, features = ["json"] }

# Generate real worlds in tests (no cycle: mapgen-world doesn't depend on lore).
[dev-dependencies]
mapgen-world = { path = "../mapgen-world" }
