<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mapgen — a cartographer's engine</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f4e9cf'/%3E%3Cpath d='M16 3 L19 13 L29 16 L19 19 L16 29 L13 19 L3 16 L13 13 Z' fill='%238a3324'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main>
      <aside class="controls">
        <header class="brand">
          <h1>mapgen</h1>
          <p class="tagline">A cartographer's engine</p>
        </header>

        <div class="field">
          <label for="seed">Seed</label>
          <div class="seed-row">
            <input id="seed" type="text" inputmode="numeric" value="42" />
            <button id="dice" type="button" class="icon" title="Random seed" aria-label="Random seed">⚄</button>
          </div>
        </div>

        <div class="field">
          <label for="cells">Detail <span class="muted" id="cells-label">4000 cells</span></label>
          <input id="cells" type="range" min="1000" max="20000" step="1000" value="4000" />
        </div>

        <div class="field">
          <label for="nations">Nations <span class="muted" id="nations-label">8</span></label>
          <input id="nations" type="range" min="1" max="16" step="1" value="8" />
        </div>

        <div class="field">
          <label for="style">Style</label>
          <select id="style">
            <option value="ornate">Ornate antique</option>
            <option value="biomes">Biomes</option>
            <option value="cultures">Cultures</option>
            <option value="greyscale">Greyscale</option>
          </select>
        </div>

        <details id="layers-panel" class="layers-panel">
          <summary>Layers</summary>
          <div id="layers" class="layers" role="group" aria-label="Map layers"></div>
        </details>

        <button id="generate" type="button" class="primary" disabled>Generate</button>

        <div class="export">
          <button id="dl-svg" type="button" disabled>SVG</button>
          <button id="dl-png" type="button" disabled>PNG</button>
          <button id="share" type="button" disabled>Copy link</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite">Loading engine…</p>

        <div class="field">
          <label for="voice">Chronicle voice</label>
          <select id="voice">
            <option value="saga">Saga</option>
            <option value="monastic-chronicle">Monastic chronicle</option>
            <option value="hymn">Hymn</option>
            <option value="courtly-letter">Courtly letter</option>
            <option value="peasant-rumor">Peasant rumour</option>
          </select>
        </div>
        <button id="narrate" type="button" disabled>Narrate a major event</button>
        <div id="chronicle" class="chronicle hidden" aria-live="polite"></div>
      </aside>

      <section id="map" class="map" aria-label="Generated map">
        <div id="map-content" class="map-content"></div>

        <div id="breadcrumb" class="breadcrumb" role="navigation" aria-label="Map scale"></div>

        <div id="timeslider" class="timeslider hidden" role="group" aria-label="History year">
          <span class="ts-caption" title="Scrub through history">⏳</span>
          <input id="timescrub" type="range" min="0" max="0" value="0" aria-label="History year" />
          <span id="timeyear" class="ts-year">—</span>
        </div>

        <div class="zoom" role="group" aria-label="Zoom controls">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-fit" type="button" aria-label="Fit to screen">⤢</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        </div>

        <div id="overlay" class="overlay hidden">
          <div class="progress-panel">
            <p id="overlay-text">Generating…</p>
            <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
            <ol id="stage-list" class="stage-list"></ol>
          </div>
        </div>

        <div id="scrubber" class="scrubber hidden" role="group" aria-label="Replay build-up">
          <button id="replay" type="button" aria-label="Replay build-up">▶</button>
          <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Scrub build stages" />
          <span id="scrub-label" class="muted"></span>
        </div>

        <p id="placeholder" class="placeholder">The map appears here.</p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
